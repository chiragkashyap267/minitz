<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Minitz website is currently under construction. Coming soon.">
  <title>Minitz — Coming soon</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #fff9ed; color: #141715; font-family: "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; }
    header { padding: 32px clamp(24px, 6vw, 88px); }
    .brand { color: #173dc6; font: bold 47px/1 Georgia, serif; letter-spacing: -.08em; }
    .brand span { font: 19px Arial, sans-serif; vertical-align: top; margin-left: 6px; }
    main { flex: 1; display: grid; place-content: center; text-align: center; padding: 45px 24px 110px; }
    .label { color: #173dc6; font-size: 11px; letter-spacing: .18em; font-weight: 650; margin: 0 0 26px; }
    h1 { font: normal clamp(64px, 10vw, 116px)/1 Georgia, serif; letter-spacing: -.065em; margin: 0 0 26px; }
    .message { color: #65645c; font-size: 16px; line-height: 1.8; margin: 0; }
    .accent { width: 36px; height: 4px; background: #ffe23f; margin: 34px auto 0; }
    footer { padding: 20px 24px 26px; text-align: center; font-size: 11px; color: #858379; }
    @media(max-width: 480px) { header { padding-top: 26px; } .brand { font-size: 40px; } .message { font-size: 14px; } main { padding-bottom: 80px; } }
  </style>
</head>
<body>
  <header><div class="brand" aria-label="Minitz">minitz<span aria-hidden="true">✳</span></div></header>
  <main>
    <p class="label">SOMETHING GOOD IS IN THE MAKING</p>
    <h1>Coming soon.</h1>
    <p class="message">Our website is currently under construction.<br>We’re getting things ready. See you soon.</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
  <footer>Minitz · A little kitchen magic.</footer>
</body>
</html>
